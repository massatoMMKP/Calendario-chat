<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f11;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6eff;
    --accent-bg: rgba(124,110,255,0.12);
    --accent-border: rgba(124,110,255,0.3);
    --text: #f0f0f2;
    --text2: #8b8b99;
    --success: #3fcf8e;
  }
  html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: var(--bg); z-index: 10;
  }
  .header-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent-bg); border: 1px solid var(--accent-border);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .header-info h1 { font-size: 14px; font-weight: 600; color: var(--text); }
  .header-info p { font-size: 11.5px; color: var(--text2); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .chat-frame {
    flex: 1;
    border: none;
    width: 100%;
    background: var(--bg);
  }
</style>
</head>
<body>
<header>
  <div class="header-icon">📅</div>
  <div class="header-info">
    <h1>Calendário Inteligente</h1>
    <p><span class="status-dot"></span> Online — Google Agenda conectado</p>
  </div>
</header>
<iframe
  class="chat-frame"
  src="https://massato.app.n8n.cloud/webhook/8f910a27-5bd1-4be3-9027-a93b713858a8/chat"
  allow="microphone"
></iframe>
</body>
</html>
